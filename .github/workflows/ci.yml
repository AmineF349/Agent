name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Tests unitaires + intégration API (Linux, rapide) sur les 3 Python supportés
  # ---------------------------------------------------------------------------
  tests-linux:
    name: pytest (ubuntu, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install (wheels only, same file as Windows)
        run: |
          python -m pip install --only-binary :all: -r requirements.txt -r requirements-dev.txt
      - name: Lint (erreurs bloquantes uniquement)
        run: python -m flake8 backend/app frontend scripts --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: pytest
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short -p no:cacheprovider 2>&1 | tee pytest.log
        # Le rapport complet est aussi publié dans le résumé du job (lisible via l'API
        # même quand le téléchargement des logs bruts est bloqué par un proxy).
      - name: Résumé pytest (annotations lisibles via l'API)
        if: always()
        shell: python
        working-directory: backend
        run: |
          import os, re, pathlib
          log = pathlib.Path("pytest.log").read_text(errors="replace") if pathlib.Path("pytest.log").exists() else "(pas de pytest.log)"
          lines = log.splitlines()
          tail = [l for l in lines if re.search(r"\b(passed|failed|error)\b", l)][-3:]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### pytest (py${{ matrix.python }})\n```\n" + "\n".join(tail) + "\n```\n")
              f.write("<details><summary>Sortie complète</summary>\n\n```\n" + log[-60000:] + "\n```\n</details>\n")
          def ann(level, title, text):
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:4000]
              print(f"::{level} title={title}::{text}")
          for l in [l for l in lines if l.startswith(("FAILED ", "ERROR "))][:20]:
              ann("error", "pytest py${{ matrix.python }}", l[:900])
          if "short test summary" in log:
              i = next(k for k, l in enumerate(lines) if "short test summary" in l)
              ann("warning", "pytest summary py${{ matrix.python }}", "\n".join(lines[i:i + 40]))
              asserts = [l for l in lines if l.startswith("E  ")][:15]
              if asserts:
                  ann("warning", "pytest assertions py${{ matrix.python }}", "\n".join(asserts))

  # ---------------------------------------------------------------------------
  # Scripts natifs Linux / macOS : setup.sh / test.sh / start.sh / stop.sh,
  # exécutés tels qu'un utilisateur les lancerait (sans root, sans Docker).
  # ---------------------------------------------------------------------------
  unix-scripts:
    name: setup/start/stop.sh (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: tests-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.10"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Contexte (utilisateur non root)
        run: |
          id -u; whoami; uname -a; bash --version | head -1
          if [ "$(id -u)" = "0" ]; then echo "::warning::le runner tourne en root"; fi
          python3 --version

      - name: setup.sh --dev (Python détecté automatiquement)
        run: |
          ./setup.sh --dev
          test -x .venv/bin/python || { echo ".venv absent"; exit 1; }
          test -f .env || { echo ".env absent"; exit 1; }
          .venv/bin/python --version

      - name: setup.sh est idempotent (2e passage = réutilisation du venv)
        run: |
          out=$(./setup.sh 2>&1); code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 0 ] || { echo "2e setup.sh a echoue ($code)"; exit 1; }
          printf '%s' "$out" | grep -q "reutilise" || { echo "Le venv existant n'a pas ete reutilise"; exit 1; }

      - name: setup.sh --python <chemin explicite> --force
        run: |
          ./setup.sh --python "$(command -v python3)" --force

      - name: test.sh
        run: ./test.sh

      - name: start.sh (backend + frontend en arrière-plan), vérification HTTP
        run: |
          ./start.sh --no-browser
          test -f logs/pids.env || { echo "logs/pids.env absent"; exit 1; }
          cat logs/pids.env

          health=$(curl -sS --noproxy '*' --max-time 15 http://127.0.0.1:8000/health)
          echo "$health" | python3 -c 'import sys, json; d = json.load(sys.stdin); assert d["status"] == "ok", d; print("Backend OK - modules :", ", ".join(d.get("modules", [])))'
          code=$(curl -s --noproxy '*' -o /dev/null -w '%{http_code}' --max-time 15 http://127.0.0.1:8501/_stcore/health)
          [ "$code" = "200" ] || { echo "Streamlit KO ($code)"; exit 1; }
          echo "Frontend OK"

          # Génération + téléchargement d'un PPTX de bout en bout via l'API
          curl -sS --noproxy '*' --max-time 60 -o logs/generate.json -X POST http://127.0.0.1:8000/api/v1/presentation/generate \
                -H 'Content-Type: application/json; charset=utf-8' \
                -d '{"presentation_type": "COMEX", "title": "CI Unix Revue Marché", "slides": [{"title": "S1", "bullets": ["a", "b"]}]}'
          python3 - "$PWD" <<'PY'
          import json, os, sys
          root = sys.argv[1]
          with open(os.path.join(root, "logs", "generate.json"), encoding="utf-8") as f:
              gen = json.load(f)
          path = gen["pptx_path"]; print("PPTX :", path)
          assert path.isascii(), f"nom non-ASCII : {path}"
          assert os.path.isfile(path), f"PPTX non genere : {path}"
          assert os.path.realpath(path).startswith(os.path.realpath(os.path.join(root, "backend", "generated"))), path
          open(os.path.join(root, "logs", "download_url.txt"), "w").write(gen["download_urls"]["pptx"])
          PY
          url="http://127.0.0.1:8000$(cat logs/download_url.txt)"
          size=$(curl -sS --noproxy '*' --max-time 30 -o /tmp/ci.pptx -w '%{size_download}' "$url")
          [ "$size" -gt 1000 ] || { echo "Telechargement PPTX KO ($size octets)"; exit 1; }
          echo "Telechargement OK ($size octets)"
          count=$(curl -sS --noproxy '*' --max-time 15 'http://127.0.0.1:8000/api/v1/presentation/files?limit=5' | python3 -c 'import sys, json; d = json.load(sys.stdin); print(d["count"]); print("/files OK :", d["directory"], file=sys.stderr)')
          [ "$count" -ge 3 ] || { echo "/files : $count fichier(s), 3 attendus"; exit 1; }

      - name: start.sh relancé = réutilise les services actifs (pas d'erreur de port)
        run: |
          out=$(./start.sh --no-browser 2>&1); code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 0 ] || { echo "2e start.sh a echoue ($code)"; exit 1; }
          printf '%s' "$out" | grep -q "reutilise" || { echo "Les services actifs n'ont pas ete detectes"; exit 1; }

      - name: stop.sh libère les ports
        run: |
          ./stop.sh
          sleep 3
          . scripts/unix/common.sh
          busy="$(port_listeners 8000) $(port_listeners 8501)"
          if [ -n "$(echo "$busy" | tr -d ' \n')" ]; then echo "Ports encore occupes : $busy"; ps -o pid,command -p $busy || true; exit 1; fi
          [ ! -f logs/pids.env ] || { echo "pids.env aurait du etre supprime"; exit 1; }
          echo "Ports 8000/8501 libres"

      - name: start.sh sur ports alternatifs (--no-reload) puis stop.sh
        run: |
          ./start.sh --backend-port 8010 --frontend-port 8511 --no-browser --no-reload
          curl -sS --noproxy '*' --max-time 15 http://127.0.0.1:8010/health | python3 -c 'import sys, json; assert json.load(sys.stdin)["status"] == "ok"'
          ./stop.sh --backend-port 8010 --frontend-port 8511
          sleep 3
          . scripts/unix/common.sh
          if [ -n "$(port_listeners 8010)$(port_listeners 8511)" ]; then echo "Ports 8010/8511 encore occupes"; exit 1; fi

      - name: Logs (toujours)
        if: always()
        run: |
          for f in logs/*.log; do [ -f "$f" ] || continue; echo "===== $f ====="; tail -n 60 "$f"; done

      - name: Diagnostic en annotations (si échec)
        if: failure()
        run: |
          annotate() {  # title text
            local t; t=$(printf '%s' "$2" | tail -c 4000 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=$1::$t"
          }
          for f in logs/*.log; do [ -f "$f" ] || continue; annotate "log $(basename "$f")" "$(tail -n 50 "$f")"; done
          . scripts/unix/common.sh
          annotate "etat" "venv: $(test -x .venv/bin/python && echo oui || echo non) | .env: $(test -f .env && echo oui || echo non)
          listeners 8000/8501/8010/8511: $(port_listeners 8000) / $(port_listeners 8501) / $(port_listeners 8010) / $(port_listeners 8511)
          $(ps -eo pid,command | grep -E 'uvicorn|streamlit|run_logged' | grep -v grep || true)"
          annotate "replay setup.sh" "$(./setup.sh 2>&1; echo "exit $?")"

  # ---------------------------------------------------------------------------
  # Le vrai test : les scripts PowerShell sur Windows, SANS droits admin,
  # avec Windows PowerShell 5.1 (celui livré avec Windows) ET PowerShell 7.
  # ---------------------------------------------------------------------------
  windows-scripts:
    name: setup/start/stop.ps1 (${{ matrix.shell }}, py${{ matrix.python }})
    runs-on: windows-latest
    needs: tests-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell   # Windows PowerShell 5.1
            python: "3.11"
          - shell: pwsh         # PowerShell 7
            python: "3.12"
          - shell: powershell
            python: "3.10"
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Contexte (version PowerShell, pas d'admin)
        run: |
          $PSVersionTable.PSVersion.ToString()
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $isAdmin = (New-Object Security.Principal.WindowsPrincipal($id)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "IsAdmin: $isAdmin"
          python --version

      - name: setup.ps1 -Dev (Python détecté automatiquement)
        run: |
          .\setup.ps1 -Dev
          if ($LASTEXITCODE -ne 0) { throw "setup.ps1 a echoue ($LASTEXITCODE)" }
          if (-not (Test-Path .\.venv\Scripts\python.exe)) { throw ".venv absent" }
          if (-not (Test-Path .\.env)) { throw ".env absent" }

      - name: setup.ps1 est idempotent (2e passage = réutilisation du venv)
        run: |
          # Write-Host ecrit dans le flux Information (6) : on le fusionne pour pouvoir l'inspecter
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $out = & { .\setup.ps1 } 6>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | Out-Host
          if ($code -ne 0) { throw "2e setup.ps1 a echoue ($code)" }
          if (-not (($out -join "`n") -match "reutilise")) { throw "Le venv existant n'a pas ete reutilise" }
          Write-Host "Duree 2e passage : $([int]$sw.Elapsed.TotalSeconds)s"

      - name: setup.ps1 -Python <chemin explicite> -Force
        run: |
          $py = (Get-Command python).Source
          .\setup.ps1 -Python $py -Force
          if ($LASTEXITCODE -ne 0) { throw "setup.ps1 -Python a echoue" }

      - name: test.ps1
        run: |
          .\test.ps1
          if ($LASTEXITCODE -ne 0) { throw "test.ps1 a echoue ($LASTEXITCODE)" }

      - name: start.ps1 -Background (backend + frontend), vérification HTTP
        run: |
          .\start.ps1 -Background -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "start.ps1 a echoue ($LASTEXITCODE)" }
          if (-not (Test-Path .\logs\pids.json)) { throw "logs\pids.json absent" }
          Get-Content .\logs\pids.json

          $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 15
          if ($health.status -ne "ok") { throw "health KO : $($health | ConvertTo-Json -Compress)" }
          Write-Host "Backend OK - modules : $($health.modules -join ', ')"

          $st = Invoke-WebRequest -Uri "http://127.0.0.1:8501/_stcore/health" -UseBasicParsing -TimeoutSec 15
          if ($st.StatusCode -ne 200) { throw "Streamlit KO ($($st.StatusCode))" }
          Write-Host "Frontend OK"

          # Génération + téléchargement de bout en bout via l'API
          $body = @{ presentation_type = "COMEX"; title = "CI Windows Revue Marché"; slides = @(@{ title = "S1"; bullets = @("a", "b") }) } | ConvertTo-Json -Depth 5
          # Invoke-WebRequest + decodage UTF-8 explicite : sous Windows PowerShell 5.1,
          # Invoke-RestMethod decode le JSON en ISO-8859-1 si le serveur n'annonce pas
          # de charset (mojibake sur les accents) -> on lit les octets bruts.
          $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/v1/presentation/generate" -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body)) -UseBasicParsing -TimeoutSec 60
          $ms = New-Object IO.MemoryStream; $resp.RawContentStream.CopyTo($ms)
          $gen = [Text.Encoding]::UTF8.GetString($ms.ToArray()) | ConvertFrom-Json
          Write-Host "PPTX : $($gen.pptx_path)"
          if ($gen.pptx_path -match '[^\x00-\x7F]') { throw "Le nom du fichier genere contient des caracteres non-ASCII : $($gen.pptx_path)" }
          if (-not (Test-Path -LiteralPath $gen.pptx_path)) { throw "PPTX non genere : $($gen.pptx_path)" }
          if (-not $gen.pptx_path.StartsWith((Resolve-Path .\backend\generated).Path)) { throw "PPTX hors de backend\generated : $($gen.pptx_path)" }
          $dl = Invoke-WebRequest -Uri ("http://127.0.0.1:8000" + $gen.download_urls.pptx) -UseBasicParsing -TimeoutSec 30
          if ($dl.StatusCode -ne 200 -or $dl.RawContentLength -lt 1000) { throw "Telechargement PPTX KO" }
          Write-Host "Telechargement OK ($($dl.RawContentLength) octets)"
          # Liste des fichiers generes via l'API
          $files = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/v1/presentation/files?limit=5" -TimeoutSec 15
          if ($files.count -lt 3) { throw "/files : $($files.count) fichier(s), 3 attendus" }
          Write-Host "/files OK ($($files.count) fichiers dans $($files.directory))"

      - name: start.ps1 relancé = réutilise les services actifs (pas d'erreur de port)
        run: |
          $out = & { .\start.ps1 -Background -NoBrowser } 6>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | Out-Host
          if ($code -ne 0) { throw "2e start.ps1 a echoue ($code)" }
          if (-not (($out -join "`n") -match "reutilise")) { throw "Les services actifs n'ont pas ete detectes" }

      - name: stop.ps1 libère les ports
        run: |
          .\stop.ps1
          Start-Sleep -Seconds 3
          $busy = Get-NetTCPConnection -LocalPort 8000, 8501 -State Listen -ErrorAction SilentlyContinue
          if ($busy) { $busy | Format-Table | Out-String | Write-Host; throw "Ports encore occupes apres stop.ps1" }
          if (Test-Path .\logs\pids.json) { throw "pids.json aurait du etre supprime" }
          Write-Host "Ports 8000/8501 libres"

      - name: start.ps1 en mode fenêtres (ports alternatifs) puis stop.ps1
        # Sur un runner sans session interactive, Start-Process powershell.exe
        # fonctionne quand meme (fenetre non visible) : on valide le quoting de
        # la ligne de commande et le lancement effectif.
        run: |
          .\start.ps1 -BackendPort 8010 -FrontendPort 8511 -NoBrowser -NoReload
          if ($LASTEXITCODE -ne 0) { throw "start.ps1 (fenetres) a echoue" }
          $h = Invoke-RestMethod -Uri "http://127.0.0.1:8010/health" -TimeoutSec 15
          if ($h.status -ne "ok") { throw "health KO sur 8010" }
          .\stop.ps1 -BackendPort 8010 -FrontendPort 8511
          Start-Sleep -Seconds 3
          if (Get-NetTCPConnection -LocalPort 8010, 8511 -State Listen -ErrorAction SilentlyContinue) { throw "Ports 8010/8511 encore occupes" }

      - name: Logs (toujours)
        if: always()
        run: |
          Get-ChildItem .\logs -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.Name) ====="
            Get-Content $_.FullName -Tail 60 -ErrorAction SilentlyContinue
          }

      - name: Diagnostic en annotations (si échec)
        if: failure()
        run: |
          function Publish-Annotation([string] $Title, [string] $Text) {
            $t = $Text.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
            if ($t.Length -gt 4000) { $t = $t.Substring($t.Length - 4000) }
            Write-Host "::warning title=$Title::$t"
          }
          Get-ChildItem .\logs -File -ErrorAction SilentlyContinue | ForEach-Object {
            Publish-Annotation "log $($_.Name)" ((Get-Content $_.FullName -Tail 50 -ErrorAction SilentlyContinue) -join "`n")
          }
          $state = @()
          $state += "PS $($PSVersionTable.PSVersion) | venv: $(Test-Path .\.venv\Scripts\python.exe) | .env: $(Test-Path .\.env)"
          $state += "Listening 8000/8501/8010/8511: " + ((Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 8000, 8501, 8010, 8511 } | ForEach-Object { "$($_.LocalAddress):$($_.LocalPort) pid=$($_.OwningProcess)" }) -join ", ")
          $state += "python procs: " + ((Get-Process -Name "python*", "pwsh", "powershell" -ErrorAction SilentlyContinue | ForEach-Object { "$($_.ProcessName):$($_.Id)" }) -join " ")
          Publish-Annotation "etat" ($state -join "`n")
          # Rejoue setup.ps1 en capturant TOUT (Information + erreurs) pour voir ce qu'il affiche
          $replay = & { .\setup.ps1 } *>&1 | ForEach-Object { "$_" }
          Publish-Annotation "replay setup.ps1 (exit $LASTEXITCODE)" ($replay -join "`n")

  # ---------------------------------------------------------------------------
  # Mode "aucun Python sur le poste" : setup.ps1 -Portable télécharge le paquet
  # nuget de la PSF et l'extrait dans .\.python\ (aucune installation système).
  # ---------------------------------------------------------------------------
  windows-portable-python:
    name: setup.ps1 -Portable (Python portable, PS 5.1)
    runs-on: windows-latest
    needs: tests-linux
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: setup.ps1 -Portable
        run: |
          .\setup.ps1 -Portable
          if ($LASTEXITCODE -ne 0) { throw "setup.ps1 -Portable a echoue ($LASTEXITCODE)" }
          if (-not (Test-Path .\.python\python.exe)) { throw ".python\python.exe absent" }
          $v = & .\.python\python.exe -c "import sys, platform; print(sys.version.split()[0], platform.architecture()[0], sys.prefix)"
          Write-Host "Python portable : $v"
          $venvBase = & .\.venv\Scripts\python.exe -c "import sys; print(sys.base_prefix)"
          Write-Host "base_prefix du venv : $venvBase"
          if (-not $venvBase.StartsWith((Resolve-Path .\.python).Path)) { throw "Le venv n'est pas base sur le Python portable" }

      - name: test.ps1 (venv portable)
        run: |
          .\test.ps1
          if ($LASTEXITCODE -ne 0) { throw "test.ps1 a echoue" }

      - name: start / health / stop
        run: |
          .\start.ps1 -Background -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "start.ps1 a echoue" }
          $h = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 15
          if ($h.status -ne "ok") { throw "health KO" }
          .\stop.ps1

      - name: Logs (toujours)
        if: always()
        run: |
          Get-ChildItem .\logs -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.Name) ====="
            Get-Content $_.FullName -Tail 60 -ErrorAction SilentlyContinue
          }
