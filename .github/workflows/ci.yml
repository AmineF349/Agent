name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Tests unitaires + intégration API (Linux, rapide) sur les 3 Python supportés
  # ---------------------------------------------------------------------------
  tests-linux:
    name: pytest (ubuntu, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-windows.txt
            requirements-dev.txt
      - name: Install (wheels only, same file as Windows)
        run: |
          python -m pip install --only-binary :all: -r requirements-windows.txt -r requirements-dev.txt
      - name: Lint (erreurs bloquantes uniquement)
        run: python -m flake8 backend/app frontend scripts --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: pytest
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short -p no:cacheprovider 2>&1 | tee pytest.log
        # Le rapport complet est aussi publié dans le résumé du job (lisible via l'API
        # même quand le téléchargement des logs bruts est bloqué par un proxy).
      - name: Résumé pytest (annotations lisibles via l'API)
        if: always()
        shell: bash
        working-directory: backend
        run: |
          {
            echo "### pytest (py${{ matrix.python }})"
            echo '```'
            grep -E "passed|failed|error" pytest.log | tail -3 || true
            echo '```'
            echo "<details><summary>Sortie complète</summary>"
            echo
            echo '```'
            tail -c 60000 pytest.log
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # Chaque test en échec -> une annotation ::error (visible dans l'API check-runs)
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | while read -r line; do
            msg=$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)
            echo "::error title=pytest py${{ matrix.python }}::${msg}"
          done
          # Bloc "short test summary" + dernière trace -> annotation warning (multi-ligne encodée)
          if grep -q "short test summary" pytest.log; then
            summary=$(sed -n '/short test summary/,$p' pytest.log | head -40 | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-4000)
            echo "::warning title=pytest summary py${{ matrix.python }}::${summary}"
            trace=$(grep -nE "^E  " pytest.log | head -15 | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-4000)
            [ -n "$trace" ] && echo "::warning title=pytest assertions py${{ matrix.python }}::${trace}"
          fi
          exit 0

  # ---------------------------------------------------------------------------
  # Le vrai test : les scripts PowerShell sur Windows, SANS droits admin,
  # avec Windows PowerShell 5.1 (celui livré avec Windows) ET PowerShell 7.
  # ---------------------------------------------------------------------------
  windows-scripts:
    name: setup/start/stop.ps1 (${{ matrix.shell }}, py${{ matrix.python }})
    runs-on: windows-latest
    needs: tests-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell   # Windows PowerShell 5.1
            python: "3.11"
          - shell: pwsh         # PowerShell 7
            python: "3.12"
          - shell: powershell
            python: "3.10"
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-windows.txt
            requirements-dev.txt

      - name: Contexte (version PowerShell, pas d'admin)
        run: |
          $PSVersionTable.PSVersion.ToString()
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $isAdmin = (New-Object Security.Principal.WindowsPrincipal($id)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "IsAdmin: $isAdmin"
          python --version

      - name: setup.ps1 -Dev (Python détecté automatiquement)
        run: |
          .\setup.ps1 -Dev
          if ($LASTEXITCODE -ne 0) { throw "setup.ps1 a echoue ($LASTEXITCODE)" }
          if (-not (Test-Path .\.venv\Scripts\python.exe)) { throw ".venv absent" }
          if (-not (Test-Path .\.env)) { throw ".env absent" }

      - name: setup.ps1 est idempotent (2e passage = réutilisation du venv)
        run: |
          $t = Measure-Command { .\setup.ps1 | Tee-Object -Variable out | Out-Host }
          if ($LASTEXITCODE -ne 0) { throw "2e setup.ps1 a echoue" }
          if (-not ($out -join "`n").Contains("reutilise")) { throw "Le venv existant n'a pas ete reutilise" }
          Write-Host "Duree 2e passage : $([int]$t.TotalSeconds)s"

      - name: setup.ps1 -Python <chemin explicite> -Force
        run: |
          $py = (Get-Command python).Source
          .\setup.ps1 -Python $py -Force
          if ($LASTEXITCODE -ne 0) { throw "setup.ps1 -Python a echoue" }

      - name: test.ps1
        run: |
          .\test.ps1
          if ($LASTEXITCODE -ne 0) { throw "test.ps1 a echoue ($LASTEXITCODE)" }

      - name: start.ps1 -Background (backend + frontend), vérification HTTP
        run: |
          .\start.ps1 -Background -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "start.ps1 a echoue ($LASTEXITCODE)" }
          if (-not (Test-Path .\logs\pids.json)) { throw "logs\pids.json absent" }
          Get-Content .\logs\pids.json

          $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 15
          if ($health.status -ne "ok") { throw "health KO : $($health | ConvertTo-Json -Compress)" }
          Write-Host "Backend OK - modules : $($health.modules -join ', ')"

          $st = Invoke-WebRequest -Uri "http://127.0.0.1:8501/_stcore/health" -UseBasicParsing -TimeoutSec 15
          if ($st.StatusCode -ne 200) { throw "Streamlit KO ($($st.StatusCode))" }
          Write-Host "Frontend OK"

          # Génération + téléchargement de bout en bout via l'API
          $body = @{ presentation_type = "COMEX"; title = "CI Windows Revue Marché"; slides = @(@{ title = "S1"; bullets = @("a", "b") }) } | ConvertTo-Json -Depth 5
          $gen = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/v1/presentation/generate" -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body)) -TimeoutSec 60
          Write-Host "PPTX : $($gen.pptx_path)"
          if (-not (Test-Path $gen.pptx_path)) { throw "PPTX non genere" }
          if (-not $gen.pptx_path.StartsWith((Resolve-Path .\backend\generated).Path)) { throw "PPTX hors de backend\generated : $($gen.pptx_path)" }
          $dl = Invoke-WebRequest -Uri ("http://127.0.0.1:8000" + $gen.download_urls.pptx) -UseBasicParsing -TimeoutSec 30
          if ($dl.StatusCode -ne 200 -or $dl.RawContentLength -lt 1000) { throw "Telechargement PPTX KO" }
          Write-Host "Telechargement OK ($($dl.RawContentLength) octets)"

      - name: start.ps1 relancé = réutilise les services actifs (pas d'erreur de port)
        run: |
          .\start.ps1 -Background -NoBrowser | Tee-Object -Variable out | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "2e start.ps1 a echoue" }
          if (-not ($out -join "`n").Contains("reutilise")) { throw "Les services actifs n'ont pas ete detectes" }

      - name: stop.ps1 libère les ports
        run: |
          .\stop.ps1
          Start-Sleep -Seconds 3
          $busy = Get-NetTCPConnection -LocalPort 8000, 8501 -State Listen -ErrorAction SilentlyContinue
          if ($busy) { $busy | Format-Table | Out-String | Write-Host; throw "Ports encore occupes apres stop.ps1" }
          if (Test-Path .\logs\pids.json) { throw "pids.json aurait du etre supprime" }
          Write-Host "Ports 8000/8501 libres"

      - name: start.ps1 en mode fenêtres (ports alternatifs) puis stop.ps1
        # Sur un runner sans session interactive, Start-Process powershell.exe
        # fonctionne quand meme (fenetre non visible) : on valide le quoting de
        # la ligne de commande et le lancement effectif.
        run: |
          .\start.ps1 -BackendPort 8010 -FrontendPort 8511 -NoBrowser -NoReload
          if ($LASTEXITCODE -ne 0) { throw "start.ps1 (fenetres) a echoue" }
          $h = Invoke-RestMethod -Uri "http://127.0.0.1:8010/health" -TimeoutSec 15
          if ($h.status -ne "ok") { throw "health KO sur 8010" }
          .\stop.ps1 -BackendPort 8010 -FrontendPort 8511
          Start-Sleep -Seconds 3
          if (Get-NetTCPConnection -LocalPort 8010, 8511 -State Listen -ErrorAction SilentlyContinue) { throw "Ports 8010/8511 encore occupes" }

      - name: Logs (toujours)
        if: always()
        run: |
          Get-ChildItem .\logs -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.Name) ====="
            Get-Content $_.FullName -Tail 60 -ErrorAction SilentlyContinue
          }

  # ---------------------------------------------------------------------------
  # Mode "aucun Python sur le poste" : setup.ps1 -Portable télécharge le paquet
  # nuget de la PSF et l'extrait dans .\.python\ (aucune installation système).
  # ---------------------------------------------------------------------------
  windows-portable-python:
    name: setup.ps1 -Portable (Python portable, PS 5.1)
    runs-on: windows-latest
    needs: tests-linux
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: setup.ps1 -Portable
        run: |
          .\setup.ps1 -Portable
          if ($LASTEXITCODE -ne 0) { throw "setup.ps1 -Portable a echoue ($LASTEXITCODE)" }
          if (-not (Test-Path .\.python\python.exe)) { throw ".python\python.exe absent" }
          $v = & .\.python\python.exe -c "import sys, platform; print(sys.version.split()[0], platform.architecture()[0], sys.prefix)"
          Write-Host "Python portable : $v"
          $venvBase = & .\.venv\Scripts\python.exe -c "import sys; print(sys.base_prefix)"
          Write-Host "base_prefix du venv : $venvBase"
          if (-not $venvBase.StartsWith((Resolve-Path .\.python).Path)) { throw "Le venv n'est pas base sur le Python portable" }

      - name: test.ps1 (venv portable)
        run: |
          .\test.ps1
          if ($LASTEXITCODE -ne 0) { throw "test.ps1 a echoue" }

      - name: start / health / stop
        run: |
          .\start.ps1 -Background -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "start.ps1 a echoue" }
          $h = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 15
          if ($h.status -ne "ok") { throw "health KO" }
          .\stop.ps1

      - name: Logs (toujours)
        if: always()
        run: |
          Get-ChildItem .\logs -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.Name) ====="
            Get-Content $_.FullName -Tail 60 -ErrorAction SilentlyContinue
          }
